[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=42", # At least v42 of setuptools required.
  "versioningit",
]

[project]
name = "meltano-target-cratedb"
description = "A Singer target / Meltano loader for CrateDB, built with the Meltano SDK, and based on the Meltano PostgreSQL target."
readme = "README.md"
keywords = [
  "CrateDB",
  "data",
  "data-toolkit",
  "ELT",
  "ETL",
  "extract",
  "ingest",
  "io",
  "load",
  "Meltano",
  "Meltano SDK",
  "pipeline",
  "Postgres",
  "PostgreSQL",
  "process",
  "Singer",
  "SQL",
  "SQLAlchemy",
  "transfer",
  "transformation",
]
license = "MIT"
authors = [ { name = "Crate.io", email = "office@crate.io" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Customer Service",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: SQL",
  "Topic :: Adaptive Technologies",
  "Topic :: Communications",
  "Topic :: Database",
  "Topic :: Documentation",
  "Topic :: Education",
  "Topic :: Internet",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Pre-processors",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Version Control",
  "Topic :: System :: Archiving",
  "Topic :: System :: Benchmark",
  "Topic :: System :: Clustering",
  "Topic :: System :: Distributed Computing",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]
dynamic = [
  "version",
]
dependencies = [
  "cratedb-toolkit",
  "importlib-resources; python_version<'3.9'", # "meltanolabs-target-postgres==0.0.9",
  "meltanolabs-target-postgres>=0.6,<0.8",
  "requests<2.34",
  "sqlalchemy-cratedb",
  "verlib2<0.4",
]
optional-dependencies.develop = [
  "black<27",
  "mypy<2.2",
  "poethepoet<1",
  "pyproject-fmt<3",
  "ruff<0.16",
  "validate-pyproject<1",
]
optional-dependencies.release = [
  "build<2",
  "twine<7",
]
optional-dependencies.test = [
  "pytest<10",
  "pytest-cov<8",
  "pytest-mock<4",
  "tap-countries",
  "tap-fundamentals",
]
urls.changelog = "https://github.com/crate/meltano-target-cratedb/blob/main/CHANGES.md"
urls.documentation = "https://github.com/crate/meltano-target-cratedb"
urls.issues = "https://github.com/crate/meltano-target-cratedb/issues"
urls.repository = "https://github.com/crate/meltano-target-cratedb"
scripts.target-cratedb = "target_cratedb.target:TargetCrateDB.cli"

[tool.setuptools]
packages.find.namespaces = false

[tool.uv]
sources.tap-countries = { git = "https://github.com/meltano/sdk.git", subdirectory = "packages/tap-countries", rev = "26a687e" }
sources.tap-fundamentals = { git = "https://github.com/meltano/sdk.git", subdirectory = "packages/tap-fundamentals", rev = "26a687e" }

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
extend-exclude = []
lint.select = [
  # Builtins
  "A",
  # Bugbear
  "B",
  # comprehensions
  "C4",
  # Pycodestyle
  "E",
  # eradicate
  "ERA",
  # Pyflakes
  "F",
  # isort
  "I",
  # pandas-vet
  "PD",
  # return
  "RET",
  # Bandit
  "S",
  # print
  "T20",
  "W",
  # flake8-2020
  "YTT",
]
lint.extend-ignore = [
  # zip() without an explicit strict= parameter
  "B905",
  # Unnecessary variable assignment before `return` statement
  "RET504",
  # Unnecessary `elif` after `return` statement
  "RET505",
  # Probable insecure usage of temporary file or directory
  "S108",
]
lint.per-file-ignores."*/tests/*" = [
  "S101", # Allow use of `assert`, and `print`.
  "S608", # Possible SQL injection vector through string-based query construction.
]
lint.per-file-ignores."examples/*" = [ "T201" ]  # Allow `print`
lint.flake8-import-conventions.banned-from = [ "typing" ]
lint.flake8-import-conventions.extend-aliases.typing = "t"

[tool.mypy]
packages = [ "target_cratedb" ]
exclude = []
check_untyped_defs = true
ignore_missing_imports = true
implicit_optional = true
install_types = true
non_interactive = true

[tool.pytest]
ini_options.addopts = """
  -rfEXs -p pytester --strict-markers --verbosity=3
  --cov --cov-report=term-missing --cov-report=xml
  """
ini_options.minversion = "2.0"
ini_options.log_level = "DEBUG"
ini_options.log_cli_level = "DEBUG"
ini_options.log_format = "%(asctime)-15s [%(name)-36s] %(levelname)-8s: %(message)s"
ini_options.testpaths = [
  "examples",
  "target_cratedb",
  "tests",
]
ini_options.xfail_strict = true
ini_options.markers = []

[tool.coverage]
run.branch = false
run.omit = [
  "tests/*",
]
run.source = [ "target_cratedb" ]
report.fail_under = 0
report.show_missing = true

[tool.poe]
# ===================
# Tasks configuration
# ===================
tasks.check = [
  "lint",
  "test",
]
tasks.format = [
  { cmd = "black ." },
  # Configure Ruff not to auto-fix (remove!):
  # unused imports (F401), unused variables (F841), `print` statements (T201), and commented-out code (ERA001).
  { cmd = "ruff check --fix --ignore=ERA --ignore=F401 --ignore=F841 --ignore=T20 --ignore=ERA001 ." },
  { cmd = "pyproject-fmt pyproject.toml" },
]
tasks.lint = [
  { cmd = "ruff check ." },
  { cmd = "black --check ." },
  { cmd = "validate-pyproject pyproject.toml" },
  { cmd = "mypy" },
]
tasks.release = [
  { cmd = "python -m build" },
  { cmd = "twine upload dist/*" },
]
tasks.test = [
  { shell = "MELTANO_CRATEDB_STRATEGY_DIRECT=true pytest" },
  { shell = "MELTANO_CRATEDB_STRATEGY_DIRECT=false pytest" },
]

[tool.versioningit]
vcs.method = "git"
vcs.default-tag = "0.0.0"
